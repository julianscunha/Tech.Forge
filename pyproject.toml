[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "**/alembic/versions",
    "**/.venv",
    "**/node_modules",
    "modules/installed/**",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "techforge_cli", "techforge_sdk"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports intencionais de submódulo
"**/tests/*.py" = ["E402"]  # sys.path.insert() antes do import local é necessário
