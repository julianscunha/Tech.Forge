<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TechForge — plataforma modular">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#3a1207"/>
    </linearGradient>
    <linearGradient id="ember" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>

  <!-- módulos conectados, canto superior direito -->
  <g opacity="0.5" stroke="#f97316" stroke-width="1.5" fill="none">
    <line x1="930" y1="60" x2="990" y2="40"/>
    <line x1="990" y1="40" x2="1050" y2="65"/>
    <line x1="990" y1="40" x2="1000" y2="95"/>
    <line x1="1050" y1="65" x2="1000" y2="95"/>
  </g>
  <g opacity="0.85">
    <rect x="918" y="48" width="24" height="24" rx="5" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="978" y="28" width="24" height="24" rx="5" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="1038" y="53" width="24" height="24" rx="5" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
    <rect x="988" y="83" width="24" height="24" rx="5" fill="#1e293b" stroke="#fb923c" stroke-width="1.5"/>
  </g>

  <!-- bigorna estilizada, canto inferior direito -->
  <g transform="translate(1005,175)">
    <circle cx="60" cy="10" r="55" fill="url(#glow)"/>
    <path d="M10 55 L110 55 L98 70 L22 70 Z" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
    <rect x="45" y="20" width="30" height="35" rx="3" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
    <path d="M25 20 Q60 2 95 20 L88 28 Q60 14 32 28 Z" fill="#334155" stroke="#fb923c" stroke-width="2"/>
    <!-- faíscas -->
    <circle cx="88" cy="6" r="2.4" fill="#fde68a"/>
    <circle cx="100" cy="14" r="1.8" fill="#fde68a"/>
    <circle cx="78" cy="-6" r="1.6" fill="#fde68a"/>
    <line x1="92" y1="0" x2="98" y2="-8" stroke="#fde68a" stroke-width="1.6"/>
    <line x1="104" y1="8" x2="112" y2="2" stroke="#fde68a" stroke-width="1.6"/>
  </g>

  <!-- título -->
  <text x="70" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">Tech<tspan fill="url(#ember)">Forge</tspan></text>
  <text x="72" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#cbd5e1">Plataforma corporativa modular — forje suas próprias ferramentas técnicas</text>

  <!-- linha de destaque -->
  <rect x="72" y="184" width="460" height="3" rx="1.5" fill="url(#ember)"/>

  <text x="72" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">Core leve · Módulos plugáveis · Local-first</text>
</svg>
