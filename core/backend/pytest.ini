[pytest]
addopts = --strict-markers
markers =
    unit: fast, isolated, deterministic — sem rede/DB/TestClient (spec Fase 15 §5)
    integration: integra componentes reais (TestClient, DB, filesystem multi-etapa) (spec Fase 15 §6)
    contract: valida contrato declarado de serviço vs. comportamento real (spec Fase 15 §7)
    e2e: fluxo crítico completo ponta a ponta (spec Fase 15 §12)
    regression: reproduz um bug corrigido, retido como guarda (spec Fase 15 §10)
    smoke: verificação rápida pós-build (spec Fase 15 §11)
